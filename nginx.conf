# Cloud Run sets PORT=8080 by default; Nginx listens on the same port.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — always serve index.html for non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; HTML must revalidate
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
